# H2 In-Memory Database Configuration for Testing
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# Auth Database (using same H2 instance with different schema)
spring.auth.datasource.driver-class-name=org.h2.Driver
spring.auth.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.auth.datasource.username=sa
spring.auth.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Database initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Disable security for testing (optional)
# management.security.enabled=false

#Mail properties
url=http://localhost:8080/advisor/verify/signup?key=
reset_password_url=http://localhost:8080/advisor/resetPassword?key=
product_mail_flag=OFF

